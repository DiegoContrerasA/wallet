<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Wallet</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wallet">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body { height: 100%; }

  body {
    background: #1c1c1e;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    display: grid;
    place-items: center;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ---------- Teléfono ---------- */
  .phone {
    position: relative;
    width: 390px;
    height: min(844px, calc(100vh - 32px));
    background: #000;
    border-radius: 56px;
    box-shadow: 0 0 0 10px #2a2a2c, 0 0 0 12px #48484a, 0 40px 80px rgba(0, 0, 0, .6);
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  @media (max-width: 500px) {
    body { background: #000; }
    .phone {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
    }
  }

  /* Instalada como app: iOS ya pinta su propia barra de estado */
  @media (display-mode: standalone) {
    body { background: #000; }
    .phone {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      border-radius: 0;
      box-shadow: none;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }
    .status { display: none; }
  }

  /* ---------- Barra de estado ---------- */
  .status {
    position: relative;
    flex: 0 0 58px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 30px 0 36px;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: -.2px;
  }
  .status .time { display: flex; align-items: center; gap: 4px; }
  .status .right { display: flex; align-items: center; gap: 6px; }
  .island {
    position: absolute;
    left: 50%;
    top: 10px;
    transform: translateX(-50%);
    width: 164px;
    height: 36px;
    border-radius: 20px;
    background: #000;
    border: 1px solid #2c2c2e;
    display: flex;
    align-items: center;
    padding-left: 13px;
  }
  .battery {
    background: #ffd60a;
    color: #000;
    font-size: 11px;
    font-weight: 700;
    border-radius: 5px;
    padding: 1px 5px;
    position: relative;
  }
  .battery::after {
    content: "";
    position: absolute;
    right: -3px; top: 50%;
    width: 2px; height: 5px;
    transform: translateY(-50%);
    background: #ffd60a;
    border-radius: 0 2px 2px 0;
    opacity: .6;
  }

  /* ---------- Escenario ---------- */
  .stage { position: relative; flex: 1; overflow: hidden; }

  .header {
    position: absolute;
    inset: 0 0 auto 0;
    height: 64px;
    padding: 8px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity .35s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .header h1 { font-size: 34px; font-weight: 700; letter-spacing: -.5px; }
  .header .actions { display: flex; gap: 10px; }
  .header .round {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #2c2c2e;
    display: grid;
    place-items: center;
  }
  .pay .header { opacity: 0; transform: translateY(-20px); pointer-events: none; }

  /* ---------- Tarjetas ---------- */
  .card {
    position: absolute;
    left: 16px;
    right: 16px;
    top: 0;
    aspect-ratio: 1.586;
    border: 0;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    font: inherit;
    color: inherit;
    text-align: left;
    transform-origin: top center;
    transition: transform .6s cubic-bezier(.2, .85, .25, 1), box-shadow .5s ease;
    box-shadow: 0 -1px 0 rgba(255, 255, 255, .12) inset, 0 -6px 16px rgba(0, 0, 0, .35);
    will-change: transform;
  }
  .card:focus-visible { outline: 3px solid #0a84ff; outline-offset: 3px; }
  .card.selected { box-shadow: 0 0 44px -4px var(--glow), 0 0 0 .5px rgba(255, 255, 255, .2) inset; }
  .card svg.art { position: absolute; inset: 0; width: 100%; height: 100%; }

  .card .label { position: absolute; left: 7.5%; top: 9%; font-size: 13px; font-weight: 700; letter-spacing: .2px; }
  .card .number { position: absolute; left: 7.5%; bottom: 7%; font-size: 15px; letter-spacing: .5px; }
  .card .number i { font-style: normal; letter-spacing: 3px; margin-right: 4px; }
  .card .brand { position: absolute; right: 7%; top: 9%; font-weight: 800; font-size: 22px; letter-spacing: -.5px; }

  .c-cmr { background: #22a621; --glow: rgba(34, 166, 33, .6); }
  .c-cmr img { position: absolute; pointer-events: none; }
  .c-cmr .logo { left: 3%; top: 5.5%; width: 25%; }
  .c-cmr .network { right: 2%; bottom: 4%; width: 21%; }
  .c-cmr .number { left: 6%; bottom: 8.5%; font-size: 17px; letter-spacing: 1.5px; }
  .c-cmr .number i { margin: 0 0 0 7px; letter-spacing: 5px; }
  .c-green  { background: #3478f6; --glow: rgba(52, 120, 246, .55); }
  .c-silver { background: linear-gradient(135deg, #f2f2f4, #9b9ba1 55%, #d9d9de); color: #1c1c1e; --glow: rgba(210, 210, 216, .45); }
  .c-dark   { background: linear-gradient(120deg, #1d1d1f, #3a3a3c 70%, #4a4a4c); --glow: rgba(140, 140, 150, .4); }

  /* ---------- Lector ---------- */
  .reader {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    opacity: 0;
    transform: scale(.85);
    pointer-events: none;
    transition: opacity .3s ease, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  .pay .reader { opacity: 1; transform: none; transition-delay: .25s; }
  .ring {
    position: relative;
    width: 62px; height: 62px;
    border-radius: 50%;
    border: 3.5px solid #0a84ff;
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .ring::before {
    content: "";
    position: absolute; inset: -3.5px;
    border-radius: 50%;
    border: 3.5px solid #0a84ff;
    animation: pulse 2s ease-out infinite;
  }
  .ring svg { transform: translateY(7px); animation: bob 2s ease-in-out infinite; }
  .reader p { font-size: 20px; color: #98989f; letter-spacing: -.2px; }

  @keyframes pulse {
    0% { transform: scale(1); opacity: .8; }
    100% { transform: scale(1.45); opacity: 0; }
  }
  @keyframes bob {
    0%, 100% { transform: translateY(8px); }
    50% { transform: translateY(5px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .header, .reader { transition-duration: .01s; }
    .ring::before, .ring svg { animation: none; }
  }
</style>
</head>
<body>

<main class="phone">
  <div class="status">
    <div class="time">
      <span id="clock">1:01</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="#fff"><path d="M21.6 2.4 2.9 10.2c-.9.4-.8 1.6.1 1.8l7 1.9 1.9 7c.2.9 1.5 1 1.8.1z"/></svg>
    </div>
    <div class="island">
      <svg width="13" height="15" viewBox="0 0 20 24" fill="#d1d1d6"><path d="M5 10V7a5 5 0 0 1 10 0v3h1a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2zm2.5 0h5V7a2.500 2.500 0 0 0-5 0z"/></svg>
    </div>
    <div class="right">
      <svg width="18" height="12" viewBox="0 0 18 12" fill="#fff">
        <rect x="0" y="8" width="3" height="4" rx="1"/>
        <rect x="5" y="5.500" width="3" height="6.500" rx="1" opacity=".35"/>
        <rect x="10" y="3" width="3" height="9" rx="1" opacity=".35"/>
        <rect x="15" y="0" width="3" height="12" rx="1" opacity=".35"/>
      </svg>
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
        <path d="M1.500 4.200a10 10 0 0 1 14 0"/>
        <path d="M4.300 7a6 6 0 0 1 8.400 0"/>
        <circle cx="8.500" cy="10.200" r=".8" fill="#fff"/>
      </svg>
      <span class="battery">54</span>
    </div>
  </div>

  <div class="stage pay" id="stage">
    <div class="header">
      <h1>Wallet</h1>
      <div class="actions">
        <span class="round"><svg width="14" height="14" viewBox="0 0 14 14" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M7 1v12M1 7h12"/></svg></span>
        <span class="round"><svg width="16" height="4" viewBox="0 0 16 4" fill="#fff"><circle cx="2" cy="2" r="1.600"/><circle cx="8" cy="2" r="1.600"/><circle cx="14" cy="2" r="1.600"/></svg></span>
      </div>
    </div>

    <!-- Tarjeta CMR -->
    <button class="card c-cmr" aria-label="Tarjeta CMR Banco Falabella 1234">
      <img class="logo" src="img/cmr-logo.png" alt="CMR Banco Falabella" draggable="false">
      <img class="network" src="img/cmr-network.png" alt="" draggable="false">
      <span class="number">1234<i>••••</i></span>
    </button>

    <!-- Tarjeta azul -->
    <button class="card c-green" aria-label="Tarjeta azul terminada en 4410">
      <svg class="art" viewBox="0 0 340 214" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#8fb8ff" stroke-width="12" stroke-linecap="round" opacity=".8">
        <path d="M10 6c20 14 30 14 50 0M80 10c14-16 34-16 48 0M150 4c16 16 40 16 56 0M230 10c12-14 30-14 42 0M294 4c12 12 26 12 40 0"/>
        <path d="M-6 40c22 16 40 16 62 0M90 44c16-14 36-14 52 0M170 38c18 18 44 18 62 0M260 46c16-12 34-12 50 0"/>
      </svg>
      <span class="label" style="top:22%">Ahorros</span>
      <span class="number"><i>••••</i>4410</span>
    </button>

    <!-- Tarjeta plateada -->
    <button class="card c-silver" aria-label="Tarjeta plateada terminada en 0385">
      <svg class="art" viewBox="0 0 340 214" preserveAspectRatio="xMidYMid slice">
        <g fill="#1c1c1e" opacity=".55">
          <rect x="14" y="5" width="312" height="3" rx="1.500"/>
        </g>
        <rect x="26" y="70" width="42" height="32" rx="6" fill="#c9b26a" stroke="#8d7a3e"/>
      </svg>
      <span class="label" style="top:15%">Platinum</span>
      <span class="number"><i>••••</i>0385</span>
    </button>

    <!-- Tarjeta oscura -->
    <button class="card c-dark" aria-label="Tarjeta de crédito terminada en 1126">
      <svg class="art" viewBox="0 0 340 214" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f5f5f7"/><stop offset=".5" stop-color="#8e8e93"/><stop offset="1" stop-color="#e5e5ea"/>
          </linearGradient>
        </defs>
        <!-- marca genérica -->
        <g transform="translate(276 22)" fill="url(#chrome)">
          <circle cx="10" cy="10" r="10"/><circle cx="34" cy="10" r="10" opacity=".85"/>
        </g>
      </svg>
      <span class="label" style="top:14%">Crédito</span>
      <span class="number"><i>••••</i>1126</span>
    </button>

    <div class="reader" id="reader" aria-live="polite">
      <div class="ring">
        <svg width="30" height="44" viewBox="0 0 30 44">
          <rect x="1" y="1" width="28" height="48" rx="6" fill="#0a4a8f" stroke="#0a84ff" stroke-width="2"/>
          <path d="M2 12 28 34v14H2z" fill="#062a52"/>
          <rect x="11" y="4" width="8" height="2" rx="1" fill="#0a84ff"/>
        </svg>
      </div>
      <p>Hold Near Reader</p>
    </div>
  </div>
</main>

<script>
  const stage = document.getElementById('stage');
  const reader = document.getElementById('reader');
  const cards = [...stage.querySelectorAll('.card')];
  let selected = 0;      // índice de la tarjeta activa
  let mode = 'pay';      // 'pay' = tarjeta lista para pagar, 'list' = todas las tarjetas

  function layout() {
    const H = stage.clientHeight;
    const cardH = cards[0].offsetHeight;
    stage.classList.toggle('pay', mode === 'pay');

    if (mode === 'list') {
      const top = 72;
      const gap = Math.min(66, (H - top - cardH - 12) / (cards.length - 1));
      cards.forEach((card, i) => {
        card.classList.remove('selected');
        card.style.zIndex = i + 1;
        card.style.transform = `translateY(${top + i * gap}px)`;
      });
      return;
    }

    // Modo pago: la seleccionada arriba, el resto apilado asomando abajo
    const rest = cards.filter((_, i) => i !== selected);
    const peek = 22 + (rest.length - 1) * 16;
    cards[selected].classList.add('selected');
    cards[selected].style.zIndex = 1;
    cards[selected].style.transform = 'translateY(10px)';
    rest.forEach((card, k) => {
      const depth = rest.length - 1 - k;   // 0 = la de adelante
      card.classList.remove('selected');
      card.style.zIndex = 10 + k;
      card.style.transform = `translateY(${H - peek + k * 16}px) scale(${1 - depth * 0.04})`;
    });
    reader.style.top = `${10 + cardH + 46}px`;
  }

  cards.forEach((card, i) => {
    card.addEventListener('click', (e) => {
      e.stopPropagation();
      if (mode === 'list') {
        selected = i;
        mode = 'pay';
      } else if (i !== selected) {
        mode = 'list';     // tocar el montón de abajo abre la lista
      }
      layout();
    });
  });

  // Tocar el fondo alterna entre los dos modos
  stage.addEventListener('click', () => {
    mode = mode === 'pay' ? 'list' : 'pay';
    layout();
  });

  function tick() {
    const d = new Date();
    document.getElementById('clock').textContent =
      `${d.getHours() % 12 || 12}:${String(d.getMinutes()).padStart(2, '0')}`;
  }

  tick();
  setInterval(tick, 10000);

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    navigator.serviceWorker.register('sw.js');
  }
  window.addEventListener('resize', layout);
  // Primer layout sin animación
  cards.forEach(c => c.style.transition = 'none');
  layout();
  requestAnimationFrame(() => requestAnimationFrame(() => cards.forEach(c => c.style.transition = '')));
</script>
</body>
</html>
